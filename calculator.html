<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OrthoGro - Inline Calculator</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-100 flex items-center justify-center min-h-screen font-sans">

    <!-- Calculator Container matching OrthoGro UI Style -->
    <div class="bg-white w-full max-w-xs mx-4 rounded-3xl shadow-xl overflow-hidden border border-slate-200">
        
        <!-- App/Calculator Header -->
        <div class="bg-white px-6 pt-5 pb-2 text-center border-b border-slate-100">
            <h1 class="text-slate-800 font-bold text-lg tracking-wide">OrthoGro</h1>
            <p class="text-xs text-slate-400 font-medium">Quick Expense Calculator</p>
        </div>

        <!-- Display Screen with Fixed Height and Stable Text Size -->
        <div class="bg-slate-50 px-6 py-4 text-right border-b border-slate-100 h-24 flex flex-col justify-between overflow-hidden">
            <div id="previous-operand" class="text-slate-400 text-xs tracking-wider truncate h-4"></div>
            <div id="current-operand" class="text-slate-800 text-3xl font-bold tracking-tight truncate h-10 leading-10">0</div>
        </div>

        <!-- Keypad Grid -->
        <div class="grid grid-cols-4 gap-2.5 p-5 bg-white">
            <!-- Row 1 -->
            <button onclick="clearDisplay()" class="bg-rose-50 text-rose-600 font-semibold py-3.5 rounded-2xl active:scale-95 transition text-sm">AC</button>
            <button onclick="deleteNumber()" class="bg-slate-100 text-slate-600 font-semibold py-3.5 rounded-2xl active:scale-95 transition text-sm">⌫</button>
            <button onclick="appendPercentage()" class="bg-emerald-50 text-emerald-700 font-bold py-3.5 rounded-2xl active:scale-95 transition text-lg">%</button>
            <button onclick="appendOperator('÷')" class="bg-emerald-50 text-emerald-700 font-bold py-3.5 rounded-2xl active:scale-95 transition text-lg">÷</button>

            <!-- Row 2 -->
            <button onclick="appendNumber('7')" class="bg-slate-50 hover:bg-slate-100 text-slate-700 font-semibold py-3.5 rounded-2xl active:scale-95 transition text-lg">7</button>
            <button onclick="appendNumber('8')" class="bg-slate-50 hover:bg-slate-100 text-slate-700 font-semibold py-3.5 rounded-2xl active:scale-95 transition text-lg">8</button>
            <button onclick="appendNumber('9')" class="bg-slate-50 hover:bg-slate-100 text-slate-700 font-semibold py-3.5 rounded-2xl active:scale-95 transition text-lg">9</button>
            <button onclick="appendOperator('×')" class="bg-emerald-50 text-emerald-700 font-bold py-3.5 rounded-2xl active:scale-95 transition text-lg">×</button>

            <!-- Row 3 -->
            <button onclick="appendNumber('4')" class="bg-slate-50 hover:bg-slate-100 text-slate-700 font-semibold py-3.5 rounded-2xl active:scale-95 transition text-lg">4</button>
            <button onclick="appendNumber('5')" class="bg-slate-50 hover:bg-slate-100 text-slate-700 font-semibold py-3.5 rounded-2xl active:scale-95 transition text-lg">5</button>
            <button onclick="appendNumber('6')" class="bg-slate-50 hover:bg-slate-100 text-slate-700 font-semibold py-3.5 rounded-2xl active:scale-95 transition text-lg">6</button>
            <button onclick="appendOperator('-')" class="bg-emerald-50 text-emerald-700 font-bold py-3.5 rounded-2xl active:scale-95 transition text-lg">-</button>

            <!-- Row 4 -->
            <button onclick="appendNumber('1')" class="bg-slate-50 hover:bg-slate-100 text-slate-700 font-semibold py-3.5 rounded-2xl active:scale-95 transition text-lg">1</button>
            <button onclick="appendNumber('2')" class="bg-slate-50 hover:bg-slate-100 text-slate-700 font-semibold py-3.5 rounded-2xl active:scale-95 transition text-lg">2</button>
            <button onclick="appendNumber('3')" class="bg-slate-50 hover:bg-slate-100 text-slate-700 font-semibold py-3.5 rounded-2xl active:scale-95 transition text-lg">3</button>
            <button onclick="appendOperator('+')" class="bg-emerald-50 text-emerald-700 font-bold py-3.5 rounded-2xl active:scale-95 transition text-lg">+</button>

            <!-- Row 5 -->
            <button onclick="appendNumber('0')" class="col-span-2 bg-slate-50 hover:bg-slate-100 text-slate-700 font-semibold py-3.5 rounded-2xl active:scale-95 transition text-lg">0</button>
            <button onclick="appendNumber('.')" class="bg-slate-50 hover:bg-slate-100 text-slate-700 font-semibold py-3.5 rounded-2xl active:scale-95 transition text-lg">.</button>
            <!-- Signature OrthoGro Green Color for Equals Button -->
            <button onclick="compute()" class="bg-emerald-700 hover:bg-emerald-800 text-white font-bold py-3.5 rounded-2xl shadow-md shadow-emerald-700/20 active:scale-95 transition text-lg">=</button>
        </div>

    </div>

    <!-- Calculator Logic Script -->
    <script>
        let currentOperandScreen = document.getElementById('current-operand');
        let previousOperandScreen = document.getElementById('previous-operand');
        
        let currentInput = '0';
        let previousInput = '';
        let operation = null;
        let isResultDisplayed = false;

        function updateDisplay() {
            currentOperandScreen.innerText = currentInput;
            previousOperandScreen.innerText = previousInput + (operation ? ` ${operation}` : '');
        }

        function appendNumber(number) {
            if (isResultDisplayed) {
                currentInput = '0';
                isResultDisplayed = false;
            }
            if (number === '.' && currentInput.includes('.')) return;
            if (currentInput === '0' && number !== '.') {
                currentInput = number;
            } else {
                currentInput += number;
            }
            updateDisplay();
        }

        function appendOperator(op) {
            if (currentInput === '' && previousInput === '') return;
            
            // If user already has a previous input and current input, keep it staged without auto calculating
            if (previousInput !== '' && currentInput !== '' && !isResultDisplayed) {
                computeQuietly();
            } else if (currentInput !== '') {
                previousInput = currentInput;
                currentInput = '';
            }
            
            operation = op;
            isResultDisplayed = false;
            updateDisplay();
        }

        // Percentage Functionality
        function appendPercentage() {
            if (currentInput === '') return;
            currentInput = (parseFloat(currentInput) / 100).toString();
            updateDisplay();
        }

        function computeQuietly() {
            const prev = parseFloat(previousInput);
            const current = parseFloat(currentInput);
            if (isNaN(prev) || isNaN(current)) return;

            let computation;
            switch (operation) {
                case '+': computation = prev + current; break;
                case '-': computation = prev - current; break;
                case '×': computation = prev * current; break;
                case '÷': computation = current === 0 ? 'Error' : prev / current; break;
                default: return;
            }
            previousInput = computation.toString();
            currentInput = '';
        }

        function compute() {
            if (operation === null || previousInput === '' || currentInput === '') return;
            
            const prev = parseFloat(previousInput);
            const current = parseFloat(currentInput);
            let computation;

            switch (operation) {
                case '+':
                    computation = prev + current;
                    break;
                case '-':
                    computation = prev - current;
                    break;
                case '×':
                    computation = prev * current;
                    break;
                case '÷':
                    computation = current === 0 ? 'Error' : prev / current;
                    break;
                default:
                    return;
            }

            currentInput = computation.toString();
            previousInput = '';
            operation = null;
            isResultDisplayed = true;
            updateDisplay();
        }

        function clearDisplay() {
            currentInput = '0';
            previousInput = '';
            operation = null;
            isResultDisplayed = false;
            updateDisplay();
        }

        function deleteNumber() {
            if (isResultDisplayed) {
                clearDisplay();
                return;
            }
            if (currentInput.length === 1 || currentInput === 'Error') {
                currentInput = '0';
            } else {
                currentInput = currentInput.slice(0, -1);
            }
            updateDisplay();
        }
    </script>
</body>
</html>
