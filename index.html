  <script type="text/babel">
    function SwipeableTransaction({ tx, onDelete, onEdit, onResolveDebt }) {
      const [offsetX, setOffsetX] = React.useState(0);
      const [isSwiped, setIsSwiped] = React.useState(false);
      const startXRef = React.useRef(0);
      const timerRef = React.useRef(null);

      const handleStart = (clientX) => {
        startXRef.current = clientX;
        timerRef.current = setTimeout(() => {
          if (window.confirm("Do you want to edit this transaction?")) {
            onEdit(tx);
          }
        }, 800);
      };

      const handleMove = (clientX) => {
        clearTimeout(timerRef.current);
        const diff = clientX - startXRef.current;
        if (diff < -5 && diff > -130) { setOffsetX(diff); } 
        else if (diff > 5 && isSwiped) { setOffsetX(0); setIsSwiped(false); }
      };

      const handleEnd = () => {
        clearTimeout(timerRef.current);
        if (offsetX < -60) { setIsSwiped(true); setOffsetX(-120); } 
        else { setIsSwiped(false); setOffsetX(0); }
      };

      return (
        <div style={{ position: 'relative', overflow: 'hidden', marginBottom: '8px', borderRadius: '16px' }}>
          <div style={{ position: 'absolute', top: 0, right: 0, bottom: 0, width: '120px', display: 'flex', zIndex: 0, borderRadius: '16px', overflow: 'hidden' }}>
            <div style={{ flex: 1, backgroundColor: '#16845B', color: 'white', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: '11px', fontWeight: 'bold', cursor: 'pointer' }} onClick={() => onEdit(tx)}>Edit</div>
            <div style={{ flex: 1, backgroundColor: '#D94848', color: 'white', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: '11px', fontWeight: 'bold', cursor: 'pointer' }} onClick={() => { if (window.confirm("Delete this?")) onDelete(tx.id); }}>Delete</div>
          </div>
          
          <div 
            onTouchStart={(e) => handleStart(e.touches[0].clientX)}
            onTouchMove={(e) => handleMove(e.touches[0].clientX)}
            onTouchEnd={handleEnd}
            onMouseDown={(e) => handleStart(e.clientX)}
            onMouseMove={(e) => { if (e.buttons === 1) handleMove(e.clientX) }}
            onMouseUp={handleEnd}
            onMouseLeave={handleEnd}
            className="t-item"
            style={{ transform: `translateX(${isSwiped ? -120 : (offsetX < 0 ? offsetX : 0)}px)`, transition: isSwiped || offsetX === 0 ? 'transform 0.3s ease' : 'none', position: 'relative', zIndex: 1, userSelect: 'none', margin: 0 }}
          >
            <div className="t-info" style={{ display: 'flex', alignItems: 'center', gap: '10px', width: '70%' }}>
              {(tx.type === 'lend' || tx.type === 'borrow') && (
                <button 
                  className="icon-btn" 
                  title={tx.resolved ? 'Undo Resolve' : (tx.type === 'lend' ? 'Resolve Lend' : 'Resolve Borrow')}
                  onClick={(e) => { e.stopPropagation(); onResolveDebt(tx); }}
                  style={{ background: tx.resolved ? '#16845B' : '#F6F8F7', color: tx.resolved ? 'white' : '#16845B', border: 'none', borderRadius: '50%', width: '30px', height: '30px', cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0 }}
                >
                  <span className="material-icons" style={{ fontSize: '16px' }}>{tx.resolved ? 'task_alt' : 'check_circle'}</span>
                </button>
              )}
              <div>
                <h4 style={{ textDecoration: tx.resolved ? 'line-through' : 'none', color: tx.resolved ? '#A0AEC0' : '#102A43' }}>{tx.title}</h4>
                <p>
                  {tx.type === 'transfer' ? (
                    <span className="t-tag" style={{background: '#EBF8FF', color: '#2B6CB0'}}>{tx.fromWallet} ➔ {tx.toWallet}</span>
                  ) : tx.type === 'lend' || tx.type === 'borrow' ? (
                    <span className="t-tag" style={{background: tx.resolved ? '#E6FFFA' : '#F6F8F7', color: tx.resolved ? '#16845B' : '#718096'}}>
                      {tx.wallet} ({tx.type === 'lend' ? 'Lend' : 'Borrow'}) {tx.resolved ? `• [Paid via ${tx.resolveWallet || tx.wallet}]` : ''}
                    </span>
                  ) : (
                    <React.Fragment>
                      <span className="t-tag">{tx.category}</span> 
                      <span className="t-tag">{tx.wallet}</span>
                    </React.Fragment>
                  )}
                  <span>{tx.date}</span>
                </p>
              </div>
            </div>
            <div className={`t-amount ${tx.resolved ? '' : tx.type}`} style={{ color: tx.resolved ? '#A0AEC0' : undefined }}>
              {tx.resolved ? '✓ ' : (tx.type === 'income' ? '+' : tx.type === 'expense' ? '-' : tx.type === 'lend' ? '-' : tx.type === 'borrow' ? '+' : '⇄')} ৳ {tx.amount.toLocaleString()}
            </div>
          </div>
        </div>
      );
    }

    function App() {
      const [activeTab, setActiveTab] = React.useState('home');
      const [settingsView, setSettingsView] = React.useState('menu');

      const [showCustomizeModal, setShowCustomizeModal] = React.useState(false);
      const [resolvingTx, setResolvingTx] = React.useState(null);
      const [resolveWallet, setResolveWallet] = React.useState('');
      const [editingItem, setEditingItem] = React.useState(null);

      const [walletToCorrect, setWalletToCorrect] = React.useState(null);
      const [correctBalanceInput, setCorrectBalanceInput] = React.useState('');
      
      const [draggedGridIndex, setDraggedGridIndex] = React.useState(null);
      const [draggedItemIndex, setDraggedItemIndex] = React.useState(null);
      const [draggedType, setDraggedType] = React.useState(null);

      const [currentUser, setCurrentUser] = React.useState(null);

      React.useEffect(() => {
        const unsubscribe = auth.onAuthStateChanged(user => {
          if (user) {
            setCurrentUser(user);
            loadCloudData(user.uid);
          } else {
            setCurrentUser(null);
          }
        });
        return () => unsubscribe();
      }, []);

      const handleGoogleLogin = async () => {
        const provider = new firebase.auth.GoogleAuthProvider();
        try {
          const result = await auth.signInWithPopup(provider);
          setCurrentUser(result.user);
          alert('Successfully signed in with ' + result.user.email);
        } catch (error) {

      const handleGoogleLogout = async () => {
        if (window.confirm("Sign out from Google account?")) {
          try {
            await auth.signOut();
            setCurrentUser(null);
          } catch (error) {
            alert('Logout error: ' + error.message);
          }
        }
      };

      const handleManualSync = () => {
        if (!currentUser) {
          alert('Please sign in with Google first to sync data.');
          return;
        }
        syncToCloud(transactions, wallets, savingsList, expenseCategories, incomeCategories);
        alert('Data successfully synced with Cloud!');
      };

      const loadCloudData = async (uid) => {
        try {
          const docRef = db.collection('users').doc(uid);
          const doc = await docRef.get();
          if (doc.exists) {
            const data = doc.data();
            if (data.transactions) setTransactions(data.transactions);
            if (data.wallets) setWallets(data.wallets);
            if (data.savingsList) setSavingsList(data.savingsList);
            if (data.expenseCategories) setExpenseCategories(data.expenseCategories);
            if (data.incomeCategories) setIncomeCategories(data.incomeCategories);
          }
        } catch (e) {
          console.error("Error loading cloud data:", e);
        }
      };

      const syncToCloud = async (newData, newWallets, newSavings, newExpCats, newIncCats) => {
        if (!currentUser) return;
        try {
          await db.collection('users').doc(currentUser.uid).set({
            transactions: newData || transactions,
            wallets: newWallets || wallets,
            savingsList: newSavings || savingsList,
            expenseCategories: newExpCats || expenseCategories,
            incomeCategories: newIncCats || incomeCategories,
            updatedAt: firebase.firestore.FieldValue.serverTimestamp()
          }, { merge: true });
        } catch (e) {
          console.error("Cloud sync error:", e);
        }
      };
      
      const [gridOrder, setGridOrder] = React.useState(() => {
        const saved = localStorage.getItem('orthogro_grid_order');
        return saved ? JSON.parse(saved) : ['netWorth', 'wallets', 'savings', 'incExp', 'lendBorrow', 'categoryReport', 'transactions'];
      });

      const [visibleGrids, setVisibleGrids] = React.useState(() => {
        const saved = localStorage.getItem('orthogro_grids');
        return saved ? JSON.parse(saved) : {
          netWorth: true,
          wallets: true,
          savings: true,
          incExp: true,
          lendBorrow: true,
          categoryReport: true,
          transactions: true
        };
      });

      React.useEffect(() => {
        localStorage.setItem('orthogro_grids', JSON.stringify(visibleGrids));
        localStorage.setItem('orthogro_grid_order', JSON.stringify(gridOrder));
      }, [visibleGrids, gridOrder]);

      const toggleGrid = (key) => {
        setVisibleGrids(prev => ({ ...prev, [key]: !prev[key] }));
      };

      // General Drag and Drop Handlers
      const handleDragStart = (e, index, type) => {
        setDraggedType(type);
        if (type === 'grid') setDraggedGridIndex(index);
        else setDraggedItemIndex(index);
        e.dataTransfer.effectAllowed = 'move';
      };

      const handleDragOver = (e, index, type) => {
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
        if (draggedType !== type) return;

        if (type === 'grid') {
          if (draggedGridIndex === null || draggedGridIndex === index) return;
          const newOrder = [...gridOrder];
          const item = newOrder.splice(draggedGridIndex, 1)[0];
          newOrder.splice(index, 0, item);
          setDraggedGridIndex(index);
          setGridOrder(newOrder);
        } else if (type === 'wallet') {
          if (draggedItemIndex === null || draggedItemIndex === index) return;
          const newList = [...wallets];
          const item = newList.splice(draggedItemIndex, 1)[0];
          newList.splice(index, 0, item);
          setDraggedItemIndex(index);
          setWallets(newList);
        } else if (type === 'savings') {
          if (draggedItemIndex === null || draggedItemIndex === index) return;
          const newList = [...savingsList];
          const item = newList.splice(draggedItemIndex, 1)[0];
          newList.splice(index, 0, item);
          setDraggedItemIndex(index);
          setSavingsList(newList);
        } else if (type === 'exp_cat') {
          if (draggedItemIndex === null || draggedItemIndex === index) return;
          const newList = [...expenseCategories];
          const item = newList.splice(draggedItemIndex, 1)[0];
          newList.splice(index, 0, item);
          setDraggedItemIndex(index);
          setExpenseCategories(newList);
        } else if (type === 'inc_cat') {
          if (draggedItemIndex === null || draggedItemIndex === index) return;
          const newList = [...incomeCategories];
          const item = newList.splice(draggedItemIndex, 1)[0];
          newList.splice(index, 0, item);
          setDraggedItemIndex(index);
          setIncomeCategories(newList);
        }
      };

      const handleDrop = (e) => {
        e.preventDefault();
        setDraggedGridIndex(null);
        setDraggedItemIndex(null);
        setDraggedType(null);
      };

      const handleDragEnd = () => {
        setDraggedGridIndex(null);
        setDraggedItemIndex(null);
        setDraggedType(null);
      };
      
      const [transactions, setTransactions] = React.useState(() => {
        const savedData = localStorage.getItem('orthogro_data');
        if (savedData) {
          let parsedData = JSON.parse(savedData);
          parsedData.sort((a, b) => new Date(b.rawDate || 0) - new Date(a.rawDate || 0));
          return parsedData;
        }
        return [];
      });

      const [wallets, setWallets] = React.useState(() => {
        const saved = localStorage.getItem('orthogro_wallets');
        return saved ? JSON.parse(saved) : ['Bank', 'Bkash', 'Nagad', 'Cash'];
      });

      const [savingsList, setSavingsList] = React.useState(() => {
        const saved = localStorage.getItem('orthogro_savings');
        return saved ? JSON.parse(saved) : ['Savings', 'Samity', 'Investment'];
      });

      const [expenseCategories, setExpenseCategories] = React.useState(() => {
        const saved = localStorage.getItem('orthogro_exp_cats');
        return saved ? JSON.parse(saved) : ['Family Maintenance', 'Relative', 'Personal', 'Career', 'Sadakah', 'Others'];
      });

      const [incomeCategories, setIncomeCategories] = React.useState(() => {
        const saved = localStorage.getItem('orthogro_inc_cats');
        return saved ? JSON.parse(saved) : ['Salary', 'Business', 'Gift', 'Others'];
      });

      const [newWalletInput, setNewWalletInput] = React.useState('');
      const [newSavingsInput, setNewSavingsInput] = React.useState('');
      const [newExpCatInput, setNewExpCatInput] = React.useState('');
      const [newIncCatInput, setNewIncCatInput] = React.useState('');

      React.useEffect(() => { 
        localStorage.setItem('orthogro_data', JSON.stringify(transactions)); 
        syncToCloud(transactions, null, null, null, null);
      }, [transactions]);

      React.useEffect(() => { 
        localStorage.setItem('orthogro_wallets', JSON.stringify(wallets)); 
        syncToCloud(null, wallets, null, null, null);
      }, [wallets]);

      React.useEffect(() => { 
        localStorage.setItem('orthogro_savings', JSON.stringify(savingsList)); 
        syncToCloud(null, null, savingsList, null, null);
      }, [savingsList]);

      React.useEffect(() => { 
        localStorage.setItem('orthogro_exp_cats', JSON.stringify(expenseCategories)); 
        syncToCloud(null, null, null, expenseCategories, null);
      }, [expenseCategories]);

      React.useEffect(() => { 
        localStorage.setItem('orthogro_inc_cats', JSON.stringify(incomeCategories)); 
        syncToCloud(null, null, null, null, incomeCategories);
      }, [incomeCategories]);

      const getTodayDate = () => {
        const now = new Date();
        return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
      };

      const allAccountOptions = [...wallets, ...savingsList];
      const defaultEntry = { id: null, title: '', amount: '', type: 'expense', category: expenseCategories[0] || 'Personal', wallet: allAccountOptions[0] || 'Bank', fromWallet: wallets[0] || 'Bank', toWallet: wallets[1] || 'Bkash', date: getTodayDate() };
      const [entries, setEntries] = React.useState([{ ...defaultEntry }]);

      const now = new Date();
      const filteredTransactions = transactions.filter(t => {
        if (!t.rawDate) return true;
        const tDate = new Date(t.rawDate);
        if (globalFilter === 'monthly') {
          return tDate.getMonth() === now.getMonth() && tDate.getFullYear() === now.getFullYear();
        } else if (globalFilter === 'yearly') {
          return tDate.getFullYear() === now.getFullYear();
        } else if (globalFilter === 'custom' && customDateFrom && customDateTo) {
          return t.rawDate >= customDateFrom && t.rawDate <= customDateTo;
        }
        return true; 
      });

      const walletBalances = {};
      wallets.forEach(w => walletBalances[w] = 0);
      savingsList.forEach(s => walletBalances[s] = 0);

      let totalIncome = 0; 
      let totalExpense = 0;
      let totalLend = 0;
      let totalBorrow = 0;
      const expenseByCategory = {};
      const txCountByWallet = {};
      const txCountByCategory = {};

      transactions.forEach(t => {
        if(t.type === 'income') {
          walletBalances[t.wallet] = (walletBalances[t.wallet] || 0) + t.amount;
          txCountByWallet[t.wallet] = (txCountByWallet[t.wallet] || 0) + 1;
        } else if (t.type === 'expense') {
          walletBalances[t.wallet] = (walletBalances[t.wallet] || 0) - t.amount;
          txCountByWallet[t.wallet] = (txCountByWallet[t.wallet] || 0) + 1;
          txCountByCategory[t.category] = (txCountByCategory[t.category] || 0) + 1;
        } else if (t.type === 'transfer') {
          walletBalances[t.fromWallet] = (walletBalances[t.fromWallet] || 0) - t.amount;
          walletBalances[t.toWallet] = (walletBalances[t.toWallet] || 0) + t.amount;
          txCountByWallet[t.fromWallet] = (txCountByWallet[t.fromWallet] || 0) + 1;
          txCountByWallet[t.toWallet] = (txCountByWallet[t.toWallet] || 0) + 1;
        } else if (t.type === 'lend') {
          walletBalances[t.wallet] = (walletBalances[t.wallet] || 0) - t.amount;
          txCountByWallet[t.wallet] = (txCountByWallet[t.wallet] || 0) + 1;

          if (!t.resolved) {
            totalLend += t.amount;
          } else {
            const targetW = t.resolveWallet || t.wallet;
            walletBalances[targetW] = (walletBalances[targetW] || 0) + t.amount;
            txCountByWallet[targetW] = (txCountByWallet[targetW] || 0) + 1;
          }
        } else if (t.type === 'borrow') {
          walletBalances[t.wallet] = (walletBalances[t.wallet] || 0) + t.amount;
          txCountByWallet[t.wallet] = (txCountByWallet[t.wallet] || 0) + 1;

          if (!t.resolved) {
            totalBorrow += t.amount;
          } else {
            const targetW = t.resolveWallet || t.wallet;
            walletBalances[targetW] = (walletBalances[targetW] || 0) - t.amount;
            txCountByWallet[targetW] = (txCountByWallet[targetW] || 0) + 1;
          }
        } else if (t.type === 'adjustment') {
          walletBalances[t.wallet] = (walletBalances[t.wallet] || 0) + t.amount;
          txCountByWallet[t.wallet] = (txCountByWallet[t.wallet] || 0) + 1;
        }

        const matchesFilter = (globalFilter === 'all') || (t.rawDate && (() => {
          const tDate = new Date(t.rawDate);
          if (globalFilter === 'monthly') return tDate.getMonth() === now.getMonth() && tDate.getFullYear() === now.getFullYear();
          if (globalFilter === 'yearly') return tDate.getFullYear() === now.getFullYear();
          if (globalFilter === 'custom' && customDateFrom && customDateTo) return t.rawDate >= customDateFrom && t.rawDate <= customDateTo;
          return true;
        })());

        if (matchesFilter) {
          if (t.type === 'income') {
            totalIncome += t.amount;
          } else if (t.type === 'expense') {
            totalExpense += t.amount;
            expenseByCategory[t.category] = (expenseByCategory[t.category] || 0) + t.amount;
          } else if (t.type === 'adjustment' && t.amount > 0) {
            totalIncome += t.amount;
          } else if (t.type === 'adjustment' && t.amount < 0) {
            totalExpense += Math.abs(t.amount);
          }
        }
      });
      
      const netWorth = totalIncome - totalExpense;
      const sortedExpenses = Object.entries(expenseByCategory).sort((a, b) => b[1] - a[1]);

      const handleEntryChange = (index, field, value) => {
        const newEntries = [...entries];
        newEntries[index][field] = value;
        if (field === 'type') {
          if (value !== 'transfer' && value !== 'lend' && value !== 'borrow') {
            newEntries[index].category = value === 'expense' ? expenseCategories[0] : incomeCategories[0];
          }
          newEntries[index].title = '';
        }
        setEntries(newEntries);
      };

      const handleAddMore = () => { setEntries([...entries, { ...defaultEntry }]); };
      const handleRemoveEntry = (index) => { setEntries(entries.filter((_, i) => i !== index)); };

      const handleAddTransaction = (e) => {
        e.preventDefault();
        for (let i = 0; i < entries.length; i++) {
          if (!entries[i].amount) return alert(`Please enter amount for entry #${i + 1}!`);
          if (entries[i].type === 'transfer' && entries[i].fromWallet === entries[i].toWallet) {
            return alert(`Entry #${i + 1}: Sender and receiver cannot be the same!`);
          }
        }

        const newTxs = entries.map((entry, index) => {
          let defaultTitle = entry.type === 'transfer' ? 'Cash Out' : entry.type === 'lend' ? 'Lend' : entry.type === 'borrow' ? 'Borrow' : entry.type === 'income' ? 'Salary month' : entry.category;
          let finalTitle = entry.title.trim() || defaultTitle;
          const selectedDate = new Date(entry.date);
          const displayDate = selectedDate.toLocaleDateString('en-US', { day: 'numeric', month: 'short', year: 'numeric' });

          return {
            id: entry.id ? entry.id : (Date.now() + index), 
            title: finalTitle,
            amount: parseFloat(entry.amount),
            type: entry.type,
            category: entry.type === 'transfer' || entry.type === 'lend' || entry.type === 'borrow' ? 'General' : entry.category,
            wallet: entry.wallet,
            fromWallet: entry.fromWallet,
            toWallet: entry.toWallet,
            date: displayDate,
            rawDate: entry.date,
            resolved: false
          };
        });

        const editedIds = entries.filter(e => e.id).map(e => e.id);
        const filteredTxs = transactions.filter(t => !editedIds.includes(t.id));

        const updatedTransactions = [...newTxs, ...filteredTxs];
        updatedTransactions.sort((a, b) => new Date(b.rawDate) - new Date(a.rawDate));
        setTransactions(updatedTransactions);
        setEntries([{ ...defaultEntry }]);
        setActiveTab('home'); 
      };

      const handleDelete = (id) => { setTransactions(transactions.filter(tx => tx.id !== id)); };

      const handleEdit = (tx) => {
        setEntries([{
          id: tx.id,
          title: tx.title,
          amount: tx.amount,
          type: tx.type,
          category: tx.category,
          wallet: tx.wallet || allAccountOptions[0],
          fromWallet: tx.fromWallet || wallets[0],
          toWallet: tx.toWallet || wallets[1],
          date: tx.rawDate || getTodayDate()
        }]);
        setActiveTab('transactions');
      };

      const handleResolveDebt = (tx) => {
        if (!tx.resolved) {
          setResolvingTx(tx);
          setResolveWallet(allAccountOptions[0]);
        } else {
          const updated = transactions.map(t => {
            if (t.id === tx.id) {
              return { ...t, resolved: false, resolveWallet: null };
            }
            return t;
          });
          setTransactions(updated);
        }
      };

      const confirmResolveDebt = () => {
        if (!resolvingTx) return;
        const updated = transactions.map(t => {
          if (t.id === resolvingTx.id) {
            return { ...t, resolved: true, resolveWallet: resolveWallet };
          }
          return t;
        });
        setTransactions(updated);
        setResolvingTx(null);
      };

      const handleWalletBalanceCorrection = () => {
        if (!walletToCorrect || correctBalanceInput === '') return;
        const targetWallet = walletToCorrect;
        const currentBal = walletBalances[targetWallet] || 0;
        const newBal = parseFloat(correctBalanceInput);
        const diff = newBal - currentBal;

        if (diff === 0) {
          setWalletToCorrect(null);
          setCorrectBalanceInput('');
          return;
        }

        const adjustmentTx = {
          id: Date.now(),
          title: `Balance Correction (${targetWallet})`,
          amount: diff,
          type: 'adjustment',
          category: 'General',
          wallet: targetWallet,
          date: new Date().toLocaleDateString('en-US', { day: 'numeric', month: 'short', year: 'numeric' }),
          rawDate: getTodayDate(),
          resolved: true
        };

        setTransactions([adjustmentTx, ...transactions]);
        setWalletToCorrect(null);
        setCorrectBalanceInput('');
      };

      const moveItem = (list, setList, index, direction) => {
        const newList = [...list];
        const targetIndex = direction === 'up' ? index - 1 : index + 1;
        if (targetIndex < 0 || targetIndex >= newList.length) return;
        const temp = newList[index];
        newList[index] = newList[targetIndex];
        newList[targetIndex] = temp;
        setList(newList);
      };

      const handleItemEditPrompt = (list, setList, item, typeName) => {
        setEditingItem({ listType: typeName, oldName: item });
        setEditInputVal(item);
      };

      const saveEditedItem = () => {
        if (!editingItem || !editInputVal.trim()) return;
        const val = editInputVal.trim();
        const { listType, oldName } = editingItem;

        if (listType === 'wallet') {
          if (wallets.includes(val)) return alert('Already exists!');
          setWallets(wallets.map(w => w === oldName ? val : w));
        } else if (listType === 'savings') {
          if (savingsList.includes(val)) return alert('Already exists!');
          setSavingsList(savingsList.map(s => s === oldName ? val : s));
        } else if (listType === 'exp_cat') {
          if (expenseCategories.includes(val)) return alert('Already exists!');
          setExpenseCategories(expenseCategories.map(c => c === oldName ? val : c));
        } else if (listType === 'inc_cat') {
          if (incomeCategories.includes(val)) return alert('Already exists!');
          setIncomeCategories(incomeCategories.map(c => c === oldName ? val : c));
        }
        setEditingItem(null);
        setEditInputVal('');
      };

      const lendTransactions = transactions.filter(t => t.type === 'lend');
      const borrowTransactions = transactions.filter(t => t.type === 'borrow');
      const totalTxCount = filteredTransactions.length;

      const renderGridByKey = (key) => {
        switch (key) {
          case 'netWorth':
            return visibleGrids.netWorth && (
              <div 
                key="netWorth"
                className="net-worth-card" 
                onClick={() => setShowFilterModal(true)}
                onContextMenu={(e) => { e.preventDefault(); setShowFilterModal(true); }}
              >
                <div className="top-row">
                  <span>Net Worth</span>
                  <span>{globalFilter === 'monthly' ? 'Monthly' : globalFilter === 'yearly' ? 'Yearly' : globalFilter === 'custom' ? 'Custom' : 'All Time'} ▾</span>
                </div>
                <h2>৳ {netWorth.toLocaleString()}</h2>
                <div className="sub-row">
                  <span>×{totalTxCount} transactions</span>
                  <span>{globalFilter === 'all' ? 'All Time' : globalFilter === 'monthly' ? 'This Month' : globalFilter === 'yearly' ? 'This Year' : 'Custom Period'}</span>
                </div>
              </div>
            );
          case 'wallets':
            return visibleGrids.wallets && (
              <div key="wallets">
                <div className="section-heading">
                  <span className="material-icons" style={{fontSize: '18px', color: '#16845B'}}>account_balance_wallet</span>
                  Wallet List
                </div>
                <div className="wallets-container">
                  {wallets.map((w, idx) => {
                    const dotColors = ['#16845B', '#2B6CB0', '#D69E2E', '#805AD5'];
                    return (
                      <div key={w} className="wallet-card" onClick={() => { setWalletToCorrect(w); setCorrectBalanceInput(walletBalances[w] || 0); }} title="Tap to correct balance">
                        <div className="wallet-dot" style={{ backgroundColor: dotColors[idx % dotColors.length] }}></div>
                        <h4>{w}</h4>
                        <div className="w-bal">৳ {(walletBalances[w] || 0).toLocaleString()}</div>
                        <div className="w-tx">{txCountByWallet[w] || 0} transactions</div>
                      </div>
                    );
                  })}
                </div>
              </div>
            );
          case 'savings':
            return visibleGrids.savings && (
              <div key="savings">
                <div className="section-heading">
                  <span className="material-icons" style={{fontSize: '18px', color: '#2B6CB0'}}>savings</span>
                  Savings & Investments
                </div>
                <div className="wallets-container">
                  {savingsList.map((s, idx) => (
                    <div key={s} className="wallet-card" onClick={() => { setWalletToCorrect(s); setCorrectBalanceInput(walletBalances[s] || 0); }} title="Tap to correct balance">
                      <div className="wallet-dot" style={{ backgroundColor: '#2B6CB0' }}></div>
                      <h4>{s}</h4>
                      <div className="w-bal">৳ {(walletBalances[s] || 0).toLocaleString()}</div>
                      <div className="w-tx">{txCountByWallet[s] || 0} transactions</div>
                    </div>
                  ))}
                </div>
              </div>
            );
          case 'incExp':
            return visibleGrids.incExp && (
              <div key="incExp" className="inc-exp-grid">
                <div className="ie-card expense">
                  <div className="ie-title"><span className="material-icons" style={{fontSize: '15px', color: '#D94848'}}>trending_down</span> Expense</div>
                  <h3>৳ {totalExpense.toLocaleString()}</h3>
                  <div className="ie-footer">
                    <span>×{filteredTransactions.filter(t=>t.type==='expense').length}</span>
                    <span>{globalFilter === 'all' ? 'All Time' : 'Filtered'}</span>
                  </div>
                </div>
                <div className="ie-card income">
                  <div className="ie-title"><span className="material-icons" style={{fontSize: '15px', color: '#16845B'}}>trending_up</span> Income</div>
                  <h3>৳ {totalIncome.toLocaleString()}</h3>
                  <div className="ie-footer">
                    <span>×{filteredTransactions.filter(t=>t.type==='income').length}</span>
                    <span>{globalFilter === 'all' ? 'All Time' : 'Filtered'}</span>
                  </div>
                </div>
              </div>
            );
          case 'lendBorrow':
            return visibleGrids.lendBorrow && (
              <div key="lendBorrow" className="grid-2-container">
                <div className="ie-card" style={{margin: 0, padding: '14px', cursor: 'pointer'}} onClick={() => setModalType('lend_list')}>
                  <div className="top-row" style={{marginBottom: '2px', display: 'flex', justifyContent: 'space-between', color: '#718096', fontSize: '12px'}}>
                    <span style={{color: '#2B6CB0', fontWeight: '600'}}>📥 Lent</span>
                    <span>×{lendTransactions.length}</span>
                  </div>
                  <h3 style={{fontSize: '18px', color: '#2B6CB0', fontWeight: '700', marginTop: '4px'}}>৳ {totalLend.toLocaleString()}</h3>
                  <div style={{marginTop: '4px', fontSize: '10px', color: '#A0AEC0'}}>Tap to view</div>
                </div>
                <div className="ie-card" style={{margin: 0, padding: '14px', cursor: 'pointer'}} onClick={() => setModalType('borrow_list')}>
                  <div className="top-row" style={{marginBottom: '2px', display: 'flex', justifyContent: 'space-between', color: '#718096', fontSize: '12px'}}>
                    <span style={{color: '#805AD5', fontWeight: '600'}}>📤 Borrowed</span>
                    <span>×{borrowTransactions.length}</span>
                  </div>
                  <h3 style={{fontSize: '18px', color: '#805AD5', fontWeight: '700', marginTop: '4px'}}>৳ {totalBorrow.toLocaleString()}</h3>
                  <div style={{marginTop: '4px', fontSize: '10px', color: '#A0AEC0'}}>Tap to view</div>
                </div>
              </div>
            );
          case 'categoryReport':
            return visibleGrids.categoryReport && (
              <div key="categoryReport" className="category-report">
                <div style={{fontSize: '14px', fontWeight: '700', color: '#102A43', marginBottom: '10px'}}>Expense by Category</div>
                {sortedExpenses.length === 0 ? (
                  <p style={{ color: '#718096', textAlign: 'center', fontSize: '12px' }}>No expense data available.</p>
                ) : (
                  sortedExpenses.map(([cat, amount]) => {
                    const percentage = totalExpense > 0 ? ((amount / totalExpense) * 100).toFixed(1) : 0;
                    return (
                      <div key={cat} className="cat-bar-container">
                        <div className="cat-header">
                          <span>{cat}</span>
                          <span>৳ {amount.toLocaleString()} ({percentage}%)</span>
                        </div>
                        <div className="cat-bg">
                          <div className="cat-fill" style={{ width: `${percentage}%` }}></div>
                        </div>
                      </div>
                    );
                  })
                )}
              </div>
            );
          case 'transactions':
            return visibleGrids.transactions && (
              <div key="transactions">
                <div style={{fontSize: '14px', fontWeight: '700', color: '#102A43', marginBottom: '8px'}}>Recent Transactions</div>
                {filteredTransactions.length === 0 && <p style={{color: '#718096', textAlign: 'center'}}>No transactions found.</p>}
                {filteredTransactions.map((tx) => (
                  <SwipeableTransaction key={tx.id} tx={tx} onDelete={handleDelete} onEdit={handleEdit} onResolveDebt={handleResolveDebt} />
                ))}
              </div>
            );
          default:
            return null;
        }
      };

      return (
        <div className="app-container">
          <header className="header">
            <div>
              <h1>OrthoGro</h1>
              <p style={{ fontSize: '11px', color: '#718096' }}>Track • Save • Grow</p>
            </div>
            <div className="header-actions">
              <button className="header-icon" title="Organize Home Grids" onClick={() => setShowCustomizeModal(true)}>
                <span className="material-icons">more_vert</span>
              </button>
            </div>
          </header>

          <main className="content">
            {activeTab === 'home' && (
              <div>
                {gridOrder.map(key => renderGridByKey(key))}
              </div>
            )}
            
            {activeTab === 'transactions' && (
              <div className="page">
                <h3 style={{ fontSize: '16px', fontWeight: '700', color: '#102A43', marginBottom: '14px' }}>{entries[0].id ? 'Edit Transaction' : 'Add New Transaction'}</h3>
                <form onSubmit={handleAddTransaction}>
                  {entries.map((entry, index) => {

                <h3 style={{ marginBottom: '12px', color: '#16845B' }}>Select Time Period</h3>
                <div style={{ display: 'flex', flexDirection: 'column', gap: '8px', marginBottom: '12px' }}>
                  <button className="btn-submit" style={{ padding: '10px', background: globalFilter === 'monthly' ? '#16845B' : '#CBD5E0' }} onClick={() => { setGlobalFilter('monthly'); setShowFilterModal(false); }}>Monthly (Default)</button>
                  <button className="btn-submit" style={{ padding: '10px', background: globalFilter === 'yearly' ? '#16845B' : '#CBD5E0' }} onClick={() => { setGlobalFilter('yearly'); setShowFilterModal(false); }}>Yearly</button>
                  <button className="btn-submit" style={{ padding: '10px', background: globalFilter === 'all' ? '#16845B' : '#CBD5E0' }} onClick={() => { setGlobalFilter('all'); setShowFilterModal(false); }}>All Time</button>
                </div>

                <div style={{ borderTop: '1px solid #E5EBE7', paddingTop: '10px' }}>
                  <label style={{ fontSize: '12px', fontWeight: '600', color: '#718096', display: 'block', marginBottom: '6px' }}>Custom Range:</label>
                  <div style={{ display: 'flex', gap: '6px', marginBottom: '8px' }}>
                    <input type="date" className="form-control" value={customDateFrom} onChange={(e) => setCustomDateFrom(e.target.value)} />
                    <input type="date" className="form-control" value={customDateTo} onChange={(e) => setCustomDateTo(e.target.value)} />
                  </div>
                  <button className="btn-submit" style={{ padding: '8px', background: '#2B6CB0', marginBottom: '8px' }} onClick={() => { if (customDateFrom && customDateTo) { setGlobalFilter('custom'); setShowFilterModal(false); } else { alert('Please select both dates'); } }}>Apply Custom</button>
                </div>

                <button className="btn-submit" style={{ padding: '8px', background: '#D94848' }} onClick={() => setShowFilterModal(false)}>Cancel</button>
              </div>
            </div>
          )}

          <nav className="bottom-nav">
            <button className={activeTab === 'home' ? 'active' : ''} onClick={() => setActiveTab('home')}>
              <span className="material-icons">home</span>
              Home
            </button>
            <button className="btn-add-tx" onClick={() => { setActiveTab('transactions'); setEntries([{ ...defaultEntry }]); }}>
              <span className="material-icons">add</span>
            </button>
            <button className={activeTab === 'settings' ? 'active' : ''} onClick={() => { setActiveTab('settings'); setSettingsView('menu'); }}>
              <span className="material-icons">settings</span>
              Settings
            </button>
          </nav>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>

</body>
</html>
